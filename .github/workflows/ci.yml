name: Libya Hoops Academy CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lha-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Phase 1 order sync tests
        run: npx vitest run tests/phase1OrderSync.test.js --pool=vmForks --maxWorkers=2 --configLoader=runner
      - name: Data and commerce validation
        run: |
          npm run validate:data
          npm run validate:commerce
          npm run validate:cloud-readiness
      - name: Production build
        run: npm run build
